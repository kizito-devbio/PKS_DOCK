name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (black)
        run: black --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/pks_dock
        continue-on-error: true  # tightened once phase scripts are fully typed

      - name: Unit tests (offline, no external bioinformatics tools required)
        run: pytest tests/ -v

  # NOTE: the end-to-end pipeline (antiSMASH, ColabFold, AutoDock Vina,
  # fpocket, PLIP) is intentionally NOT run in CI. Those tools are large,
  # GPU/compute-heavy, and licensed/distributed separately -- CI here
  # validates the Python package logic (retries, caching, decision
  # logging, CLI parsing) that this repository is actually responsible for.
